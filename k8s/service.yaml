apiVersion: v1
kind: Service
metadata:
  name: freshcart-backend-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: freshcart-backend
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: freshcart-frontend-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: freshcart-frontend
  ports:
    - port: 3000
      targetPort: 3000
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: freshcart-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: freshcart.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: freshcart-backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: freshcart-frontend-service
                port:
                  number: 3000
