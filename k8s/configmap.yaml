apiVersion: v1
kind: ConfigMap
metadata:
  name: freshcart-config
  namespace: default
data:
  ENVIRONMENT: "production"
  APP_NAME: "FreshCart Grocery & Logistics Platform"
  PROJECT_VERSION: "1.0.0"
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"
---
apiVersion: v1
kind: Secret
metadata:
  name: freshcart-secrets
  namespace: default
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://freshcart_user:freshcart_secure_password_2026@postgres-service:5432/freshcart_db"
  REDIS_URL: "redis://redis-service:6379/0"
  SECRET_KEY: "freshcart_super_secret_jwt_encryption_key_production_2026"
